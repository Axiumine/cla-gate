#
# Git hooks (Lefthook v2). Installed by the root `postinstall` script (Yarn Berry never runs `prepare`).
# docs/toolchain.md (Hook pipeline) has the hook pipeline table. Hooks are bypassable, so .github/workflows/ci.yml
# repeats every check and is the authority. `yarn gate` runs the pre-push pipeline over the whole repo.
#
# Order is cheap and deterministic first, expensive last; `piped: true` stops at the first failing step.
# `parallel` and `piped` cannot be combined on one level, hence the nested `group` for the independent checks.
# Semgrep (E20-S01) and Trivy (E20-S02) joined this file together with their CI jobs (a hook job must have a CI counterpart).
min_version: 2.0.0
assert_lefthook_installed: true
glob_matcher: doublestar

pre-commit:
  piped: true
  jobs:
    # Format and fix first so every later step sees the final text; fixed files are re-staged.
    - name: biome
      run: yarn biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: staged-checks
      group:
        parallel: true
        jobs:
          - name: eslint
            glob: "**/*.{ts,mjs}"
            run: yarn eslint --max-warnings 0 --no-warn-ignored {staged_files}
            skip: [merge, rebase]
          # Never add --coverage here: the 100% thresholds fail on a partial run.
          - name: vitest-related
            glob: "**/*.ts"
            run: yarn vitest related --run --passWithNoTests {staged_files}
            skip: [merge, rebase]
          - name: caps
            run: yarn caps
          # Secret scan of the whole tree (E20-S02); the CI trivy job repeats it inside `yarn trivy`. It needs no vulnerability
          # database, so it is fast and works offline once Trivy is installed. Unlike Semgrep it has NO skip rule for a missing
          # binary: an operator without Trivy uses LEFTHOOK_EXCLUDE=trivy,semgrep, which leaves out both jobs of this name.
          - name: trivy
            run: yarn trivy:secrets

pre-push:
  piped: true
  jobs:
    - name: biome
      run: yarn lint:biome
    - name: typecheck
      run: yarn typecheck
    - name: static-analysis
      group:
        parallel: true
        jobs:
          - name: eslint
            run: yarn lint:eslint
          # Escape hatches without a written reason (explicit any, as, coverage and type-coverage ignores): E20-S16.
          - name: escape-hatches
            run: yarn lint:hatches
          - name: type-coverage
            run: yarn type-coverage
          - name: knip
            run: yarn knip
          - name: fta
            run: yarn fta
          - name: caps
            run: yarn caps
          # Security scan (E20-S01), the same script as the CI semgrep job. Skipped when the binary is not installed
          # (it is a Python tool and not a dependency of this repository); CI never skips it. The name matters:
          # LEFTHOOK_EXCLUDE=trivy,semgrep is the sanctioned offline exception. Not in pre-commit.
          - name: semgrep
            run: yarn semgrep
            skip:
              - run: "! command -v semgrep >/dev/null 2>&1"
          # Vulnerabilities (HIGH and CRITICAL, fixed only), then secrets and misconfiguration (E20-S02): the same script as the
          # CI trivy job. No skip rule: a missing Trivy fails the push, and LEFTHOOK_EXCLUDE=trivy,semgrep is the way out
          # offline (the vulnerability database and the checks bundle are downloaded). The dev-dependency pass is CI-only.
          - name: trivy
            run: yarn trivy
          # The same script as the CI static job: no job may run on a runner docs/ci-runners.md does not allow.
          - name: ci-runners
            run: yarn ci:runners
    # Last because it is the most expensive and meaningless when a static check fails. CI=1 is set by the script.
    - name: coverage
      run: yarn coverage

# Reinstall dependencies when the lockfile or the Yarn config changed (a convenience, not a gate).
post-merge:
  jobs:
    - name: yarn-install
      run: git diff --quiet ORIG_HEAD HEAD -- yarn.lock .yarnrc.yml || yarn install --immutable
# Git passes the previous and the new HEAD to post-checkout, and Lefthook hands them on as {1} and {2}. (`HEAD@{1}` is no
# substitute: Lefthook rewrites its {1} too, which leaves the bad revision `HEAD@<sha>`.)
post-checkout:
  jobs:
    - name: yarn-install
      run: git diff --quiet {1} {2} -- yarn.lock .yarnrc.yml || yarn install --immutable
post-rewrite:
  jobs:
    - name: yarn-install
      run: git diff --quiet ORIG_HEAD HEAD -- yarn.lock .yarnrc.yml || yarn install --immutable
