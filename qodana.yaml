#
# E20-S08. Qodana is a required check that fails closed: it needs a paid licence and the secret QODANA_TOKEN, and the
# `qodana` job of .github/workflows/ci.yml turns red, never skipped, on any run without that token (a fork pull request
# gets no secrets, so it is red until a maintainer pushes the branch into the repository). The job runs the linter below
# pinned by digest as well (`--linter <tag>@sha256:...` in the workflow); a test keeps the two in step.
#
# There is no baseline file. A finding is fixed in the code, or excluded here with a comment that says why, or silenced
# in the source with `//noinspection <Name> -- <reason>` (the escape-hatch gate, `yarn lint:hatches`, rejects one
# without a reason). failThreshold 0 makes any problem fail the run with exit code 255.
version: "1.0"
linter: jetbrains/qodana-js:2026.2
profile:
  name: qodana.recommended
failThreshold: 0
exclude:
  # Every relative import in this repository names its file with the extension and a barrel as `/index.ts`, because Node's
  # type stripping needs that on the server and `src/shared` is imported by both projects. ES6PreferShortImport wants the
  # extension and the `/index` dropped (94 findings in src/web); doing that in one project would break the one style the
  # repository has, and ESLint and TypeScript already check that every import resolves.
  - name: ES6PreferShortImport
  # Qodana's JavaScript analysis reports calls of zod's `z.iso.datetime(...)` as deprecated symbols: it picks the
  # deprecated `z.string().datetime()` method by name, and which of the calls it flags changes from one run to the next
  # (two on main with no argument, six on a branch that has a chained `z.iso\n.datetime(...)`). TypeScript and
  # typescript-eslint's type-aware `no-deprecated` (part of strictTypeChecked, zero warnings) resolve the real symbol and
  # report none, and they do report a deprecated API that really is one, so the exact check stays and this one goes.
  - name: JSDeprecatedSymbols
