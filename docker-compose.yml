#
# Local development database: `yarn db:up` (it picks a random free port above 32768, remembers it in the git-ignored
# .local/ directory and runs compose with POSTGRES_PORT set), then `yarn db:migrate` and `yarn dev`; `yarn db:url` prints
# the connection strings and `yarn db:down` stops it. There is deliberately no default port: running `docker compose`
# by hand without POSTGRES_PORT fails with the message below instead of publishing 5432.
# The passwords below are well-known development defaults for a database that listens on 127.0.0.1 only. They are not
# secrets and must never be reused anywhere else. Production gets its credentials from the environment or a secret
# manager (see docs/configuration.md).
#
# Two roles on purpose: `cla_owner` owns the schema and runs the migrations (`MIGRATION_DATABASE_URL`), `cla_app` is the
# unprivileged runtime role (`DATABASE_URL`) that migration 001 grants minimal privileges to. The application never
# owns its tables, which is what keeps the immutability triggers meaningful.
name: cla-gate

services:
  postgres:
    # Same major version as the CI database container (scripts/ci/postgres.ts) and as PGlite (PostgreSQL 18).
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: cla_owner
      POSTGRES_PASSWORD: cla_owner_dev_only
      POSTGRES_DB: cla
    ports:
      # Loopback only, on a port scripts/dev/db.ts chose. 5432 is the container's own port, not a host port.
      - "127.0.0.1:${POSTGRES_PORT:?run yarn db:up, which picks a free port above 32768}:5432"
    volumes:
      # PostgreSQL 18 images keep the cluster in a versioned subdirectory, so the volume mounts one level up.
      - cla-postgres-data:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cla_owner -d cla"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cla-postgres-data:
