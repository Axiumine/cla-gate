#
# Actions are pinned to full commit SHAs, so Dependabot is what keeps them current (it rewrites the SHA and the
# version comment together). The cooldown keeps brand-new releases out for a week, on top of Yarn's one-day
# npmMinimalAgeGate. Dependabot opens PRs only; nothing here merges anything.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # docs/quality-gates.md, "TypeScript": stay on ~6.0.x until typescript-eslint, Stryker, type-coverage and the
      # caps tool support the TypeScript 7 compiler API. Patch releases still come through.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # @vitest/coverage-v8 must match the exact Vitest version, so they move together.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint"]
      # Lockstep packages (E20-S09). A dependency joins the first group that matches it, so these stay above dev-tooling's "*"
      # and set no update-types: a major bump of one has to carry the others. scripts/ci-contract.test.ts asserts all of this.
      # @playwright/test also names the browser image (scripts/e2e-pin.test.ts fails until the image tags follow).
      playwright:
        patterns: ["@playwright/test"]
      stryker:
        patterns: ["@stryker-mutator/*"]
      memlab:
        patterns: ["memlab", "@memlab/api"]
      # @tailwindcss/vite depends on the exact version of tailwindcss (E17-S05), so a bump of one has to carry the other.
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      dev-tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
